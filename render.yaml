services:
  # Express Backend Web Service
  - type: web
    name: kathavani-backend
    plan: free
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js

    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  # React Frontend Static Site
  - type: web
    name: kathavani-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false



